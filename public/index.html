<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profiles</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body { 
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
      background: linear-gradient(135deg, #0f0f1e 0%, #1a1a2e 50%, #16213e 100%);
      color: #e0e0e0;
      display: flex; 
      justify-content: center; 
      align-items: center; 
      min-height: 100vh;
      padding: 20px;
    }
    
    .container { 
      width: 100%; 
      max-width: 450px; 
      padding: 40px 30px;
      background: rgba(22, 33, 62, 0.7);
      border-radius: 12px;
      border: 1px solid rgba(226, 183, 20, 0.1);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(10px);
    }
    
    h2 { 
      text-align: center; 
      margin-bottom: 30px; 
      color: #e2b714;
      font-size: 28px;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    h3 {
      color: #e2b714;
      font-size: 14px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-top: 28px;
      margin-bottom: 16px;
      opacity: 0.9;
    }
    
    .tabs { 
      display: flex; 
      margin-bottom: 30px;
      gap: 0;
      border-bottom: 2px solid rgba(226, 183, 20, 0.2);
    }
    
    .tab { 
      flex: 1; 
      padding: 12px 16px; 
      text-align: center; 
      cursor: pointer; 
      background: transparent;
      border: none;
      border-bottom: 3px solid transparent;
      color: #b0b0b0;
      font-weight: 600;
      font-size: 14px;
      transition: all 0.3s ease;
      margin-bottom: -2px;
      position: relative;
    }
    
    .tab:hover { 
      color: #e2b714;
      background: rgba(226, 183, 20, 0.05);
    }
    
    .tab.active { 
      border-bottom-color: #e2b714;
      color: #e2b714;
      background: rgba(226, 183, 20, 0.08);
    }

    .tab.hidden {
      display: none;
    }
    
    input { 
      width: 100%; 
      padding: 12px 14px;
      margin-bottom: 14px;
      border: 1.5px solid rgba(226, 183, 20, 0.3);
      background: rgba(15, 52, 96, 0.5);
      color: #e0e0e0;
      border-radius: 6px;
      font-size: 14px;
      transition: all 0.3s ease;
      font-family: inherit;
    }

    input::placeholder {
      color: #707070;
    }
    
    input:focus { 
      outline: none;
      border-color: #e2b714;
      background: rgba(15, 52, 96, 0.8);
      box-shadow: 0 0 0 3px rgba(226, 183, 20, 0.1);
    }
    
    button { 
      width: 100%; 
      padding: 13px 16px;
      margin-top: 4px;
      margin-bottom: 10px;
      background: linear-gradient(135deg, #e2b714 0%, #d4a812 100%);
      color: #1a1a2e;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 700;
      font-size: 14px;
      letter-spacing: 0.5px;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(226, 183, 20, 0.2);
      text-transform: uppercase;
    }
    
    button:hover { 
      background: linear-gradient(135deg, #f0c930 0%, #e2b714 100%);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(226, 183, 20, 0.3);
    }

    button:active {
      transform: translateY(0);
    }
    
    .message { 
      margin-top: 18px; 
      padding: 14px 16px;
      border-radius: 6px;
      text-align: center;
      font-size: 14px;
      font-weight: 500;
      border: 1px solid;
      animation: slideIn 0.3s ease;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    
    .success { 
      background: rgba(78, 204, 163, 0.15);
      color: #4ecca3;
      border-color: rgba(78, 204, 163, 0.3);
    }
    
    .error { 
      background: rgba(255, 107, 107, 0.15);
      color: #ff8787;
      border-color: rgba(255, 107, 107, 0.3);
    }
    
    .profile { 
      margin-top: 24px; 
      padding: 20px;
      background: linear-gradient(135deg, rgba(15, 52, 96, 0.6) 0%, rgba(22, 33, 62, 0.8) 100%);
      border-radius: 8px;
      border: 1px solid rgba(226, 183, 20, 0.2);
      animation: slideIn 0.3s ease;
    }
    
    .profile p { 
      margin-bottom: 12px;
      font-size: 14px;
      line-height: 1.6;
    }

    .profile strong {
      color: #e2b714;
      font-weight: 600;
    }
    
    .hidden { display: none; }
    
    .logout-btn { 
      margin-top: 16px;
      background: linear-gradient(135deg, #d4a812 0%, #b8940a 100%);
      box-shadow: 0 4px 15px rgba(212, 168, 18, 0.2);
    }
    
    .logout-btn:hover { 
      background: linear-gradient(135deg, #e2b714 0%, #d4a812 100%);
      box-shadow: 0 6px 20px rgba(226, 183, 20, 0.3);
    }
    
    .form-section { display: none; }
    .form-section.active { display: block; }

    @media (max-width: 480px) {
      .container {
        padding: 30px 20px;
        border-radius: 12px;
      }
      h2 {
        font-size: 24px;
        margin-bottom: 24px;
      }
      .tabs {
        margin-bottom: 24px;
      }
      .tab {
        padding: 10px 12px;
        font-size: 13px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Profiles App</h2>

    <div class="tabs">
      <div class="tab active" onclick="showTab('signup')">Sign Up</div>
      <div class="tab" onclick="showTab('login')">Log In</div>
      <div class="tab hidden" id="settings-tab" onclick="showTab('settings')">Settings</div>
    </div>

    <!-- Sign Up -->
    <div id="signup-form" class="form-section active">
      <input type="text" id="s-first" placeholder="First name" />
      <input type="text" id="s-last" placeholder="Last name" />
      <input type="text" id="s-username" placeholder="Username" />
      <input type="email" id="s-email" placeholder="Email" />
      <input type="password" id="s-password" placeholder="Password" />
      <button onclick="signup()">Create Account</button>
    </div>

    <!-- Login -->
    <div id="login-form" class="form-section hidden">
      <input type="text" id="l-username" placeholder="Username" />
      <input type="password" id="l-password" placeholder="Password" />
      <button onclick="login()">Log In</button>
    </div>

    <!-- Settings -->
    <div id="settings-form" class="form-section hidden">
      <div id="profile-info"></div>
      <h3>Change Password</h3>
      <input type="password" id="current-password" placeholder="Current password" />
      <input type="password" id="new-password" placeholder="New password" />
      <input type="password" id="confirm-password" placeholder="Confirm new password" />
      <button onclick="changePassword()">Change Password</button>
      <button class="logout-btn" onclick="logout()">Log Out</button>
    </div>

    <div id="message"></div>
    <div id="profile" class="profile hidden"></div>
  </div>

  <script>
    // Check authentication on page load
    window.addEventListener('load', async () => {
      await checkAuth();
    });

    async function checkAuth() {
      try {
        const res = await fetch('/api/check-auth');
        const data = await res.json();
        if (data.authenticated) {
          showAuthenticatedUI(data.user);
        }
      } catch (err) {
        console.error('Auth check error:', err);
      }
    }

    function showAuthenticatedUI(user) {
      // Hide signup/login tabs, show settings tab
      document.getElementById('signup-form').classList.remove('active');
      document.getElementById('login-form').classList.remove('active');
      document.getElementById('settings-form').classList.add('active');
      
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.getElementById('settings-tab').classList.remove('hidden');
      document.getElementById('settings-tab').classList.add('active');
      
      document.querySelector('.tab:nth-child(1)').classList.add('hidden');
      document.querySelector('.tab:nth-child(2)').classList.add('hidden');
      
      loadSettings();
    }

    function showUnauthenticatedUI() {
      // Show signup/login tabs, hide settings tab
      document.getElementById('settings-form').classList.remove('active');
      document.getElementById('signup-form').classList.add('active');
      document.getElementById('settings-tab').classList.add('hidden');
      
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('hidden', 'active'));
      document.querySelector('.tab:nth-child(1)').classList.add('active');
      
      document.getElementById('message').innerHTML = '';
      document.getElementById('profile').classList.add('hidden');
    }

    function showTab(tab) {
      document.getElementById('signup-form').classList.toggle('active', tab === 'signup');
      document.getElementById('login-form').classList.toggle('active', tab === 'login');
      document.getElementById('settings-form').classList.toggle('active', tab === 'settings');
      
      document.querySelectorAll('.tab').forEach((t, i) => {
        t.classList.toggle('active', 
          (tab === 'signup' && i === 0) || 
          (tab === 'login' && i === 1) ||
          (tab === 'settings' && t.id === 'settings-tab')
        );
      });
      document.getElementById('message').innerHTML = '';
      if (tab !== 'settings') {
        document.getElementById('profile').classList.add('hidden');
      }
    }

    function showMessage(text, type) {
      document.getElementById('message').innerHTML = `<div class="message ${type}">${text}</div>`;
    }

    function showProfile(user) {
      const el = document.getElementById('profile');
      el.classList.remove('hidden');
      el.innerHTML = `
        <p><strong>Name:</strong> ${user.first_name} ${user.last_name}</p>
        <p><strong>Username:</strong> ${user.username}</p>
        <p><strong>Email:</strong> ${user.email}</p>
        <p><strong>Joined:</strong> ${new Date(user.created_at).toLocaleDateString()}</p>
      `;
    }

    async function loadSettings() {
      try {
        const res = await fetch('/api/settings');
        if (!res.ok) {
          showMessage('Session expired. Please log in again.', 'error');
          showUnauthenticatedUI();
          return;
        }
        const data = await res.json();
        const user = data.user;
        const profileEl = document.getElementById('profile-info');
        profileEl.innerHTML = `
          <div class="profile">
            <p><strong>Name:</strong> ${user.first_name} ${user.last_name}</p>
            <p><strong>Username:</strong> ${user.username}</p>
            <p><strong>Email:</strong> ${user.email}</p>
            ${user.phone ? `<p><strong>Phone:</strong> ${user.phone}</p>` : ''}
            ${user.bio ? `<p><strong>Bio:</strong> ${user.bio}</p>` : ''}
            <p><strong>Member since:</strong> ${new Date(user.created_at).toLocaleDateString()}</p>
          </div>
        `;
      } catch (err) {
        console.error('Load settings error:', err);
        showMessage('Error loading settings', 'error');
      }
    }

    async function signup() {
      const body = {
        firstName: document.getElementById('s-first').value,
        lastName: document.getElementById('s-last').value,
        username: document.getElementById('s-username').value,
        email: document.getElementById('s-email').value,
        password: document.getElementById('s-password').value
      };

      try {
        const res = await fetch('/api/signup', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });
        const data = await res.json();
        if (res.ok) {
          showMessage('Account created! Please log in.', 'success');
          document.getElementById('s-first').value = '';
          document.getElementById('s-last').value = '';
          document.getElementById('s-username').value = '';
          document.getElementById('s-email').value = '';
          document.getElementById('s-password').value = '';
        } else {
          showMessage(data.error, 'error');
        }
      } catch (err) {
        showMessage('Connection error', 'error');
      }
    }

    async function login() {
      const body = {
        username: document.getElementById('l-username').value,
        password: document.getElementById('l-password').value
      };

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
          credentials: 'same-origin'
        });
        const data = await res.json();
        if (res.ok) {
          showMessage('Welcome back!', 'success');
          showAuthenticatedUI(data.user);
        } else {
          showMessage(data.error, 'error');
        }
      } catch (err) {
        showMessage('Connection error', 'error');
      }
    }

    async function changePassword() {
      const currentPassword = document.getElementById('current-password').value;
      const newPassword = document.getElementById('new-password').value;
      const confirmPassword = document.getElementById('confirm-password').value;

      if (!currentPassword || !newPassword || !confirmPassword) {
        showMessage('All password fields are required', 'error');
        return;
      }

      if (newPassword !== confirmPassword) {
        showMessage('New passwords do not match', 'error');
        return;
      }

      if (newPassword.length < 6) {
        showMessage('New password must be at least 6 characters', 'error');
        return;
      }

      try {
        const res = await fetch('/api/change-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            currentPassword,
            newPassword
          }),
          credentials: 'same-origin'
        });
        const data = await res.json();
        if (res.ok) {
          showMessage(data.message, 'success');
          document.getElementById('current-password').value = '';
          document.getElementById('new-password').value = '';
          document.getElementById('confirm-password').value = '';
          setTimeout(() => {
            showUnauthenticatedUI();
            showTab('login');
          }, 2000);
        } else {
          showMessage(data.error, 'error');
        }
      } catch (err) {
        showMessage('Connection error', 'error');
      }
    }

    async function logout() {
      try {
        const res = await fetch('/api/logout', {
          method: 'POST',
          credentials: 'same-origin'
        });
        if (res.ok) {
          showMessage('Logged out successfully', 'success');
          showUnauthenticatedUI();
          showTab('login');
        } else {
          showMessage('Logout failed', 'error');
        }
      } catch (err) {
        showMessage('Connection error', 'error');
      }
    }
  </script>
</body>
</html>
