<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profiles</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
      background: linear-gradient(135deg, #0f0f1e 0%, #1a1a2e 50%, #16213e 100%);
      color: #e0e0e0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      padding: 40px 20px;
    }

    /* ── Auth container ──────────────────────────────────────────── */
    #auth-container {
      width: 100%;
      max-width: 450px;
      padding: 40px 30px;
      background: rgba(22, 33, 62, 0.7);
      border-radius: 12px;
      border: 1px solid rgba(226, 183, 20, 0.1);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(10px);
    }

    h2 {
      text-align: center;
      margin-bottom: 30px;
      color: #e2b714;
      font-size: 28px;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    h3 {
      color: #e2b714;
      font-size: 14px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-top: 28px;
      margin-bottom: 16px;
      opacity: 0.9;
    }

    /* ── Auth tabs ───────────────────────────────────────────────── */
    .tabs {
      display: flex;
      margin-bottom: 30px;
      border-bottom: 2px solid rgba(226, 183, 20, 0.2);
    }

    .tab {
      flex: 1;
      padding: 12px 16px;
      text-align: center;
      cursor: pointer;
      background: transparent;
      border-bottom: 3px solid transparent;
      color: #b0b0b0;
      font-weight: 600;
      font-size: 14px;
      transition: all 0.3s ease;
      margin-bottom: -2px;
    }

    .tab:hover { color: #e2b714; background: rgba(226, 183, 20, 0.05); }
    .tab.active { border-bottom-color: #e2b714; color: #e2b714; background: rgba(226, 183, 20, 0.08); }

    /* ── Inputs (text / email / password) ────────────────────────── */
    input:not([type="range"]):not([type="checkbox"]) {
      width: 100%;
      padding: 12px 14px;
      margin-bottom: 14px;
      border: 1.5px solid rgba(226, 183, 20, 0.3);
      background: rgba(15, 52, 96, 0.5);
      color: #e0e0e0;
      border-radius: 6px;
      font-size: 14px;
      transition: all 0.3s ease;
      font-family: inherit;
    }

    input:not([type="range"]):not([type="checkbox"])::placeholder { color: #707070; }

    input:not([type="range"]):not([type="checkbox"]):focus {
      outline: none;
      border-color: #e2b714;
      background: rgba(15, 52, 96, 0.8);
      box-shadow: 0 0 0 3px rgba(226, 183, 20, 0.1);
    }

    /* ── Range input reset ───────────────────────────────────────── */
    input[type="range"] {
      width: 100%;
      padding: 0;
      margin: 0;
      border: none;
      background: transparent;
      border-radius: 0;
      accent-color: #e2b714;
      cursor: pointer;
    }

    input[type="range"]:focus { outline: none; box-shadow: none; border: none; }

    /* ── Buttons ─────────────────────────────────────────────────── */
    button {
      width: 100%;
      padding: 13px 16px;
      margin-top: 4px;
      margin-bottom: 10px;
      background: linear-gradient(135deg, #e2b714 0%, #d4a812 100%);
      color: #1a1a2e;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 700;
      font-size: 14px;
      letter-spacing: 0.5px;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(226, 183, 20, 0.2);
      text-transform: uppercase;
    }

    button:hover {
      background: linear-gradient(135deg, #f0c930 0%, #e2b714 100%);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(226, 183, 20, 0.3);
    }

    button:active { transform: translateY(0); }

    /* ── Messages ────────────────────────────────────────────────── */
    .message {
      margin-top: 18px;
      padding: 14px 16px;
      border-radius: 6px;
      text-align: center;
      font-size: 14px;
      font-weight: 500;
      border: 1px solid;
      animation: slideIn 0.3s ease;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(-10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .success { background: rgba(78,204,163,0.15); color: #4ecca3; border-color: rgba(78,204,163,0.3); }
    .error   { background: rgba(255,107,107,0.15); color: #ff8787; border-color: rgba(255,107,107,0.3); }

    /* ── Profile card ────────────────────────────────────────────── */
    .profile {
      margin-top: 8px;
      padding: 20px;
      background: linear-gradient(135deg, rgba(15,52,96,0.6) 0%, rgba(22,33,62,0.8) 100%);
      border-radius: 8px;
      border: 1px solid rgba(226,183,20,0.2);
      animation: slideIn 0.3s ease;
    }

    .profile p { margin-bottom: 12px; font-size: 14px; line-height: 1.6; }
    .profile p:last-child { margin-bottom: 0; }
    .profile strong { color: #e2b714; font-weight: 600; }

    .hidden { display: none !important; }

    .logout-btn {
      margin-top: 16px;
      background: linear-gradient(135deg, #d4a812 0%, #b8940a 100%);
      box-shadow: 0 4px 15px rgba(212,168,18,0.2);
    }

    .logout-btn:hover {
      background: linear-gradient(135deg, #e2b714 0%, #d4a812 100%);
      box-shadow: 0 6px 20px rgba(226,183,20,0.3);
    }

    .form-section { display: none; }
    .form-section.active { display: block; }

    /* ── Main App Shell ──────────────────────────────────────────── */
    #main-app {
      width: 100%;
      max-width: 900px;
      animation: slideIn 0.3s ease;
    }

    .app-header {
      background: rgba(22, 33, 62, 0.7);
      border-radius: 12px 12px 0 0;
      border: 1px solid rgba(226, 183, 20, 0.1);
      border-bottom: none;
      padding: 24px 30px 0;
      backdrop-filter: blur(10px);
    }

    .app-header h2 { margin-bottom: 20px; }

    .app-nav {
      display: flex;
      border-bottom: 2px solid rgba(226, 183, 20, 0.2);
    }

    .app-tab {
      padding: 12px 20px;
      cursor: pointer;
      border-bottom: 3px solid transparent;
      color: #b0b0b0;
      font-weight: 600;
      font-size: 14px;
      transition: all 0.3s ease;
      margin-bottom: -2px;
      user-select: none;
    }

    .app-tab:hover { color: #e2b714; background: rgba(226, 183, 20, 0.05); }
    .app-tab.active { border-bottom-color: #e2b714; color: #e2b714; }

    .app-panel {
      background: rgba(22, 33, 62, 0.7);
      border: 1px solid rgba(226, 183, 20, 0.1);
      border-top: none;
      border-radius: 0 0 12px 12px;
      padding: 30px;
      backdrop-filter: blur(10px);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
    }

    .app-panel > h3:first-child { margin-top: 0; }

    /* ── Add Flag Form ───────────────────────────────────────────── */
    .add-flag-form {
      display: flex;
      gap: 10px;
      margin-bottom: 24px;
      align-items: flex-end;
      flex-wrap: wrap;
    }

    .add-flag-form input:not([type="range"]):not([type="checkbox"]) {
      flex: 1;
      min-width: 140px;
      margin-bottom: 0;
    }

    .add-flag-form button {
      width: auto;
      padding: 12px 24px;
      margin: 0;
      white-space: nowrap;
      flex-shrink: 0;
    }

    /* ── Flag Cards ──────────────────────────────────────────────── */
    #flags-list { display: flex; flex-direction: column; gap: 14px; }

    .flag-card {
      background: rgba(15, 52, 96, 0.4);
      border: 1px solid rgba(226, 183, 20, 0.15);
      border-radius: 8px;
      padding: 20px;
      transition: border-color 0.2s ease;
    }

    .flag-card:hover { border-color: rgba(226, 183, 20, 0.3); }

    .flag-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 16px;
      gap: 12px;
    }

    .flag-info { display: flex; flex-direction: column; gap: 4px; flex: 1; }
    .flag-name { font-weight: 600; font-size: 15px; color: #e0e0e0; }
    .flag-desc { font-size: 12px; color: #888; }

    /* ── Toggle Switch ───────────────────────────────────────────── */
    .toggle {
      position: relative;
      display: inline-block;
      width: 44px;
      height: 24px;
      flex-shrink: 0;
      margin-top: 2px;
    }

    .toggle input[type="checkbox"] {
      opacity: 0;
      width: 0;
      height: 0;
      margin: 0;
      padding: 0;
      position: absolute;
      border: none;
      background: none;
      box-shadow: none;
    }

    .toggle-slider {
      position: absolute;
      cursor: pointer;
      inset: 0;
      background: rgba(255,255,255,0.08);
      border-radius: 24px;
      border: 1px solid rgba(255,255,255,0.12);
      transition: 0.3s;
    }

    .toggle-slider::after {
      content: '';
      position: absolute;
      width: 18px;
      height: 18px;
      left: 2px;
      top: 2px;
      background: #666;
      border-radius: 50%;
      transition: 0.3s;
    }

    .toggle input:checked + .toggle-slider {
      background: rgba(226,183,20,0.2);
      border-color: rgba(226,183,20,0.5);
    }

    .toggle input:checked + .toggle-slider::after {
      transform: translateX(20px);
      background: #e2b714;
    }

    /* ── Rollout Slider ──────────────────────────────────────────── */
    .flag-rollout { margin-bottom: 16px; }

    .rollout-label {
      display: block;
      font-size: 13px;
      color: #b0b0b0;
      margin-bottom: 10px;
    }

    .rollout-label strong { color: #e2b714; }

    /* ── Simulate User Access Widget ────────────────────────────── */
    .simulate-widget {
      background: rgba(226, 183, 20, 0.05);
      border: 1px solid rgba(226, 183, 20, 0.2);
      border-radius: 8px;
      padding: 18px 20px;
      margin-bottom: 24px;
    }

    .simulate-widget h4 {
      margin: 0 0 14px;
      font-size: 12px;
      font-weight: 600;
      color: #e2b714;
      text-transform: uppercase;
      letter-spacing: 0.6px;
    }

    .sim-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

    .sim-row input:not([type="range"]):not([type="checkbox"]) {
      flex: 1;
      min-width: 180px;
      margin: 0;
    }

    .sim-btn {
      width: auto;
      padding: 10px 20px;
      margin: 0;
      font-size: 13px;
      flex-shrink: 0;
    }

    .sim-results {
      margin-top: 16px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .sim-result-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 12px;
      background: rgba(255,255,255,0.04);
      border-radius: 6px;
      gap: 12px;
    }

    .sim-flag-name {
      font-size: 13px;
      color: #c0c0c0;
      font-weight: 500;
    }

    .access-badge {
      font-size: 12px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 20px;
      flex-shrink: 0;
    }

    .badge-granted { background: rgba(78,204,163,0.15); color: #4ecca3; border: 1px solid rgba(78,204,163,0.3); }
    .badge-denied  { background: rgba(255,107,107,0.15); color: #ff8787; border: 1px solid rgba(255,107,107,0.3); }

    /* ── Delete Button ───────────────────────────────────────────── */
    .flag-footer { display: flex; justify-content: flex-end; margin-top: 4px; }

    .delete-flag-btn {
      width: auto;
      padding: 5px 14px;
      margin: 0;
      font-size: 11px;
      background: transparent;
      color: #ff8787;
      border: 1px solid rgba(255,107,107,0.25);
      box-shadow: none;
    }

    .delete-flag-btn:hover {
      background: rgba(255,107,107,0.1);
      border-color: rgba(255,107,107,0.5);
      transform: none;
      box-shadow: none;
    }

    .no-flags {
      text-align: center;
      color: #555;
      font-size: 14px;
      padding: 48px 0;
    }

    /* ── Settings panel constraints ──────────────────────────────── */
    #panel-settings input:not([type="range"]):not([type="checkbox"]) { max-width: 420px; }
    #panel-settings button { max-width: 420px; }

    /* ── Responsive ──────────────────────────────────────────────── */
    @media (max-width: 640px) {
      body { padding: 20px 12px; }
      .add-flag-form { flex-direction: column; }
      .add-flag-form input:not([type="range"]):not([type="checkbox"]) { min-width: 0; }
      .add-flag-form button { width: 100%; }
      .app-panel { padding: 20px; }
      .app-header { padding: 20px 20px 0; }
      #panel-settings input:not([type="range"]):not([type="checkbox"]),
      #panel-settings button { max-width: 100%; }
    }

    @media (max-width: 480px) {
      #auth-container { padding: 30px 20px; }
      h2 { font-size: 24px; margin-bottom: 24px; }
      .tabs { margin-bottom: 24px; }
      .tab { padding: 10px 12px; font-size: 13px; }
    }
  </style>
</head>
<body>

  <!-- Auth Container -->
  <div id="auth-container">
    <h2>Profiles App</h2>

    <div class="tabs">
      <div class="tab active" onclick="showTab('signup')">Sign Up</div>
      <div class="tab" onclick="showTab('login')">Log In</div>
    </div>

    <div id="signup-form" class="form-section active">
      <input type="text"     id="s-first"    placeholder="First name" />
      <input type="text"     id="s-last"     placeholder="Last name" />
      <input type="text"     id="s-username" placeholder="Username" />
      <input type="email"    id="s-email"    placeholder="Email" />
      <input type="password" id="s-password" placeholder="Password" />
      <button onclick="signup()">Create Account</button>
    </div>

    <div id="login-form" class="form-section">
      <input type="text"     id="l-username" placeholder="Username" />
      <input type="password" id="l-password" placeholder="Password" />
      <button onclick="login()">Log In</button>
    </div>

    <div id="auth-message"></div>
  </div>

  <!-- Main App (authenticated) -->
  <div id="main-app" class="hidden">

    <div class="app-header">
      <h2>Profiles App</h2>
      <div class="app-nav">
        <div class="app-tab active" onclick="switchPanel('flags')">Feature Flags</div>
        <div class="app-tab"        onclick="switchPanel('settings')">Settings</div>
      </div>
    </div>

    <!-- Feature Flags Panel -->
    <div id="panel-flags" class="app-panel">
      <h3>Manage Feature Flags</h3>
      <div class="add-flag-form">
        <input type="text" id="new-flag-name" placeholder="Flag name (e.g. Dark Mode)" />
        <input type="text" id="new-flag-desc" placeholder="Description (optional)" />
        <button onclick="addFlag()">+ Add Flag</button>
      </div>
      <div class="simulate-widget">
        <h4>Simulate User Access</h4>
        <div class="sim-row">
          <input type="text" id="global-sim-user" placeholder="Enter a user ID to simulate access across all flags…">
          <button class="sim-btn" onclick="simulateAllAccess()">Simulate</button>
        </div>
        <div id="sim-results" class="sim-results hidden"></div>
      </div>
      <div id="flags-list"></div>
    </div>

    <!-- Settings Panel -->
    <div id="panel-settings" class="app-panel hidden">
      <h3>Profile</h3>
      <div id="profile-info"></div>
      <h3>Change Password</h3>
      <input type="password" id="current-password" placeholder="Current password" />
      <input type="password" id="new-password"     placeholder="New password" />
      <input type="password" id="confirm-password" placeholder="Confirm new password" />
      <button onclick="changePassword()">Change Password</button>
      <button class="logout-btn" onclick="logout()">Log Out</button>
    </div>

    <div id="app-message"></div>
  </div>

  <script>
    // ── Bootstrap ──────────────────────────────────────────────────
    window.addEventListener('load', () => checkAuth());

    async function checkAuth() {
      try {
        const res = await fetch('/api/check-auth');
        const data = await res.json();
        if (data.authenticated) showAuthenticatedUI();
      } catch (err) {
        console.error('Auth check error:', err);
      }
    }

    // ── Auth shell ─────────────────────────────────────────────────
    function showAuthenticatedUI() {
      document.getElementById('auth-container').classList.add('hidden');
      document.getElementById('main-app').classList.remove('hidden');
      loadSettings();
      initFlags();
    }

    function showUnauthenticatedUI() {
      document.getElementById('main-app').classList.add('hidden');
      document.getElementById('auth-container').classList.remove('hidden');
      document.getElementById('signup-form').classList.add('active');
      document.getElementById('login-form').classList.remove('active');
      document.querySelectorAll('#auth-container .tab').forEach((t, i) => {
        t.classList.toggle('active', i === 0);
      });
      document.getElementById('auth-message').innerHTML = '';
    }

    function showTab(tab) {
      document.getElementById('signup-form').classList.toggle('active', tab === 'signup');
      document.getElementById('login-form').classList.toggle('active', tab === 'login');
      document.querySelectorAll('#auth-container .tab').forEach((t, i) => {
        t.classList.toggle('active', (tab === 'signup' && i === 0) || (tab === 'login' && i === 1));
      });
      document.getElementById('auth-message').innerHTML = '';
    }

    function switchPanel(panel) {
      document.getElementById('panel-flags').classList.toggle('hidden', panel !== 'flags');
      document.getElementById('panel-settings').classList.toggle('hidden', panel !== 'settings');
      document.querySelectorAll('.app-tab').forEach((t, i) => {
        t.classList.toggle('active', (panel === 'flags' && i === 0) || (panel === 'settings' && i === 1));
      });
      document.getElementById('app-message').innerHTML = '';
    }

    function showMessage(text, type) {
      const inApp = !document.getElementById('main-app').classList.contains('hidden');
      const el = document.getElementById(inApp ? 'app-message' : 'auth-message');
      el.innerHTML = `<div class="message ${type}">${text}</div>`;
    }

    // ── Settings ───────────────────────────────────────────────────
    async function loadSettings() {
      try {
        const res = await fetch('/api/settings');
        if (!res.ok) {
          showMessage('Session expired. Please log in again.', 'error');
          showUnauthenticatedUI();
          return;
        }
        const data = await res.json();
        const u = data.user;
        document.getElementById('profile-info').innerHTML = `
          <div class="profile">
            <p><strong>Name:</strong> ${u.first_name} ${u.last_name}</p>
            <p><strong>Username:</strong> ${u.username}</p>
            <p><strong>Email:</strong> ${u.email}</p>
            ${u.phone ? `<p><strong>Phone:</strong> ${u.phone}</p>` : ''}
            ${u.bio   ? `<p><strong>Bio:</strong> ${u.bio}</p>`     : ''}
            <p><strong>Member since:</strong> ${new Date(u.created_at).toLocaleDateString()}</p>
          </div>
        `;
      } catch (err) {
        console.error('Load settings error:', err);
        showMessage('Error loading settings', 'error');
      }
    }

    // ── Feature Flags: data layer ──────────────────────────────────
    const FLAGS_KEY = 'feature_flags_v1';

    const DEFAULT_FLAGS = [
      { id: 'dark_mode',       name: 'Dark Mode',       description: 'Enable dark theme for all users',        enabled: true,  rolloutPercentage: 100 },
      { id: 'beta_dashboard',  name: 'Beta Dashboard',  description: 'New analytics dashboard (experimental)', enabled: true,  rolloutPercentage: 25  },
      { id: 'ai_assistant',    name: 'AI Assistant',    description: 'Experimental AI-powered features',       enabled: false, rolloutPercentage: 10  }
    ];

    function loadFlags() {
      try {
        const raw = localStorage.getItem(FLAGS_KEY);
        return raw ? JSON.parse(raw) : DEFAULT_FLAGS.map(f => ({ ...f }));
      } catch {
        return DEFAULT_FLAGS.map(f => ({ ...f }));
      }
    }

    function saveFlags(flags) {
      localStorage.setItem(FLAGS_KEY, JSON.stringify(flags));
    }

    function slugify(str) {
      return str.toLowerCase().replace(/\s+/g, '_').replace(/[^a-z0-9_]/g, '').slice(0, 32);
    }

    function createFlag(name, description) {
      const flags = loadFlags();
      let id = slugify(name) || 'flag_' + Date.now();
      let unique = id, n = 1;
      while (flags.some(f => f.id === unique)) unique = id + '_' + n++;
      saveFlags([...flags, { id: unique, name: name.trim(), description: description.trim(), enabled: false, rolloutPercentage: 0 }]);
    }

    function deleteFlag(id) {
      saveFlags(loadFlags().filter(f => f.id !== id));
    }

    function updateFlag(id, patch) {
      const flags = loadFlags();
      const i = flags.findIndex(f => f.id === id);
      if (i !== -1) { flags[i] = { ...flags[i], ...patch }; saveFlags(flags); }
    }

    // ── Feature Flags: access logic ────────────────────────────────
    function simpleHash(str) {
      let h = 0;
      for (let i = 0; i < str.length; i++) h = (Math.imul(31, h) + str.charCodeAt(i)) | 0;
      return Math.abs(h);
    }

    function computeAccess(userId, flag) {
      if (!flag.enabled)                 return false;
      if (flag.rolloutPercentage >= 100) return true;
      if (flag.rolloutPercentage <= 0)   return false;
      return simpleHash(userId + ':' + flag.id) % 100 < flag.rolloutPercentage;
    }

    // ── Feature Flags: render ──────────────────────────────────────
    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;')
        .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function initFlags() { renderFlags(); }

    function renderFlags() {
      const flags = loadFlags();
      const list = document.getElementById('flags-list');
      if (!flags.length) {
        list.innerHTML = '<p class="no-flags">No flags yet. Add one above.</p>';
        return;
      }
      list.innerHTML = flags.map(flag => `
        <div class="flag-card">
          <div class="flag-header">
            <div class="flag-info">
              <span class="flag-name">${escapeHtml(flag.name)}</span>
              ${flag.description ? `<span class="flag-desc">${escapeHtml(flag.description)}</span>` : ''}
            </div>
            <label class="toggle" title="${flag.enabled ? 'Enabled' : 'Disabled'}">
              <input type="checkbox" ${flag.enabled ? 'checked' : ''} onchange="toggleFlag('${flag.id}', this.checked)">
              <span class="toggle-slider"></span>
            </label>
          </div>

          <div class="flag-rollout">
            <span class="rollout-label">Rollout: <strong id="pct-${flag.id}">${flag.rolloutPercentage}%</strong></span>
            <input type="range" min="0" max="100" value="${flag.rolloutPercentage}"
              oninput="updateRolloutLabel('${flag.id}', this.value)"
              onchange="saveRollout('${flag.id}', this.value)">
          </div>

          <div class="flag-footer">
            <button class="delete-flag-btn" onclick="confirmDeleteFlag('${flag.id}')">Delete</button>
          </div>
        </div>
      `).join('');
    }

    function toggleFlag(id, enabled) {
      updateFlag(id, { enabled });
      renderFlags();
    }

    function updateRolloutLabel(id, value) {
      const el = document.getElementById('pct-' + id);
      if (el) el.textContent = value + '%';
    }

    function saveRollout(id, value) {
      updateFlag(id, { rolloutPercentage: parseInt(value, 10) });
    }

    function simulateAllAccess() {
      const input     = document.getElementById('global-sim-user');
      const resultsEl = document.getElementById('sim-results');
      const userId    = input.value.trim();
      if (!userId) { input.focus(); return; }
      const flags = loadFlags();
      if (!flags.length) {
        resultsEl.innerHTML = '<p style="color:#888;font-size:13px;margin:0">No flags configured.</p>';
        resultsEl.classList.remove('hidden');
        return;
      }
      resultsEl.innerHTML = flags.map(flag => {
        const granted = computeAccess(userId, flag);
        return `<div class="sim-result-row">
          <span class="sim-flag-name">${escapeHtml(flag.name)}</span>
          <span class="access-badge ${granted ? 'badge-granted' : 'badge-denied'}">${granted ? 'Access Granted' : 'No Access'}</span>
        </div>`;
      }).join('');
      resultsEl.classList.remove('hidden');
    }

    function confirmDeleteFlag(id) {
      const flag = loadFlags().find(f => f.id === id);
      const name = flag ? flag.name : id;
      if (confirm(`Delete flag "${name}"?`)) {
        deleteFlag(id);
        renderFlags();
      }
    }

    function addFlag() {
      const nameEl = document.getElementById('new-flag-name');
      const descEl = document.getElementById('new-flag-desc');
      const name = nameEl.value.trim();
      if (!name) { nameEl.focus(); return; }
      createFlag(name, descEl.value);
      nameEl.value = '';
      descEl.value = '';
      renderFlags();
    }

    // ── Auth actions ───────────────────────────────────────────────
    async function signup() {
      const body = {
        firstName: document.getElementById('s-first').value,
        lastName:  document.getElementById('s-last').value,
        username:  document.getElementById('s-username').value,
        email:     document.getElementById('s-email').value,
        password:  document.getElementById('s-password').value
      };
      try {
        const res  = await fetch('/api/signup', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
        const data = await res.json();
        if (res.ok) {
          showMessage('Account created! Please log in.', 'success');
          ['s-first','s-last','s-username','s-email','s-password'].forEach(id => { document.getElementById(id).value = ''; });
        } else {
          showMessage(data.error, 'error');
        }
      } catch { showMessage('Connection error', 'error'); }
    }

    async function login() {
      const body = {
        username: document.getElementById('l-username').value,
        password: document.getElementById('l-password').value
      };
      try {
        const res  = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body), credentials: 'same-origin' });
        const data = await res.json();
        if (res.ok) {
          showAuthenticatedUI();
        } else {
          showMessage(data.error, 'error');
        }
      } catch { showMessage('Connection error', 'error'); }
    }

    async function changePassword() {
      const current = document.getElementById('current-password').value;
      const next    = document.getElementById('new-password').value;
      const confirm = document.getElementById('confirm-password').value;

      if (!current || !next || !confirm) { showMessage('All password fields are required', 'error'); return; }
      if (next !== confirm)              { showMessage('New passwords do not match', 'error'); return; }
      if (next.length < 6)              { showMessage('New password must be at least 6 characters', 'error'); return; }

      try {
        const res  = await fetch('/api/change-password', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ currentPassword: current, newPassword: next }), credentials: 'same-origin' });
        const data = await res.json();
        if (res.ok) {
          showMessage(data.message, 'success');
          ['current-password','new-password','confirm-password'].forEach(id => { document.getElementById(id).value = ''; });
          setTimeout(() => { showUnauthenticatedUI(); showTab('login'); }, 2000);
        } else {
          showMessage(data.error, 'error');
        }
      } catch { showMessage('Connection error', 'error'); }
    }

    async function logout() {
      try {
        const res = await fetch('/api/logout', { method: 'POST', credentials: 'same-origin' });
        if (res.ok) {
          showUnauthenticatedUI();
          showTab('login');
        } else {
          showMessage('Logout failed', 'error');
        }
      } catch { showMessage('Connection error', 'error'); }
    }
  </script>
</body>
</html>
